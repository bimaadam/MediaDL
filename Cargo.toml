[package]
name = "media-engine"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Multi-platform media download engine with global deduplication"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
s3 = { version = "0.1.40", default-features = false, features = ["async", "rustls", "multipart", "tracing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate", "json", "macros"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls", "macros"] }
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "process", "fs", "io-util", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "timeout", "limit", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
