name: media-engine

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      MEDIA_ENGINE_ENVIRONMENT: ${MEDIA_ENGINE_ENVIRONMENT:-development}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
      MEDIA_ENGINE__TELEGRAM__ENABLED: ${MEDIA_ENGINE__TELEGRAM__ENABLED:-false}
      MEDIA_ENGINE__OBSERVABILITY__METRICS_BIND: 0.0.0.0:9090
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "media-engine", "healthcheck", "api"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      MEDIA_ENGINE_ENVIRONMENT: ${MEDIA_ENGINE_ENVIRONMENT:-development}
      MIGRATE_ON_START: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
      MEDIA_ENGINE__TELEGRAM__ENABLED: ${MEDIA_ENGINE__TELEGRAM__ENABLED:-false}
      MEDIA_ENGINE__OBSERVABILITY__METRICS_BIND: 0.0.0.0:9091
    ports:
      - "127.0.0.1:9091:9091"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "media-engine", "healthcheck", "worker"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 40s

volumes:
  postgres-data:
  redis-data:
